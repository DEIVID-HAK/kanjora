name: Kanjora CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-contracts:
    name: Validate OpenAPI Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for Spectral
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spectral Linter
        run: npm install -g @stoplight/spectral-cli

      - name: Lint Domain OpenAPI Contract
        run: spectral lint contracts/openapi/domain-api-v1.yaml --ruleset https://unpkg.com/@stoplight/spectral-rulesets/dist/oas.js || true

      - name: Lint Sessions OpenAPI Contract
        run: spectral lint contracts/openapi/sessions-api-v1.yaml --ruleset https://unpkg.com/@stoplight/spectral-rulesets/dist/oas.js || true

  test-domain-api:
    name: Domain API (Java 21 / Spring Boot) Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kanjora
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: postgres_admin_dev_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_admin -d kanjora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Execute Flyway Isolation Migration
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres_admin_dev_pwd psql -h localhost -U postgres_admin -d kanjora -f infra/postgres/init-isolation.sql

      - name: Run Domain API Unit & Integration Tests
        working-directory: services/domain-api
        run: ./mvnw clean test

  docker-compose-smoketest:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Environment with Docker Compose
        run: docker compose up -d

      - name: Wait for Containers to be Healthy
        run: |
          sleep 15
          docker compose ps
