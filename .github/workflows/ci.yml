name: Kanjora CI Pipeline

on:
  push:
    branches: ["main", "devop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contracts:
    name: Validate OpenAPI Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for Spectral
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint OpenAPI Contracts
        run: >-
          npx --yes @stoplight/spectral-cli@6 lint
          "contracts/openapi/*.yaml"
          --ruleset .spectral.yaml
          --fail-severity=error

      - name: Reject An Invalid Contract
        run: |
          if npx --yes @stoplight/spectral-cli@6 lint tests/fixtures/spectral/invalid-contract.yaml \
              --ruleset .spectral.yaml --fail-severity=error; then
            echo "::error::Spectral accepted an invalid contract; the contract gate is not effective."
            exit 1
          fi

  test-domain-api:
    name: Domain API (Java 21 / Spring Boot) Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kanjora
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: postgres_admin_dev_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_admin -d kanjora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Validate Schema Isolation SQL
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres_admin_dev_pwd psql -h localhost -U postgres_admin -d kanjora \
            -v ON_ERROR_STOP=1 -f infra/postgres/init-isolation.sql

      - name: Run Domain API Unit & Integration Tests
        working-directory: services/domain-api
        run: mvn -B clean test

  test-sessions-api:
    name: Sessions API (Go) Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sessions-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/sessions-api/go.mod
          cache-dependency-path: services/sessions-api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -race ./...

  docker-compose-smoketest:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Environment
        run: docker compose up -d --wait --wait-timeout 240

      - name: Assert Keycloak Realm Is Served
        run: |
          curl -fsS --retry 20 --retry-delay 3 --retry-connrefused \
            http://localhost:8180/realms/kanjora | grep -q '"realm" *: *"kanjora"'

      - name: Assert PostgreSQL Accepts Connections
        run: pg_isready -h localhost -p 5432 -U postgres_admin

      - name: Assert LiveKit Port Is Listening
        run: timeout 10 bash -c '</dev/tcp/127.0.0.1/7880'

      - name: Show Container State
        if: always()
        run: docker compose ps -a

      - name: Dump Logs On Failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear Down
        if: always()
        run: docker compose down -v
